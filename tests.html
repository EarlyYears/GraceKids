<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GraceKids — tests</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,sans-serif;
       background:#F2F2F7;color:#1D1D1F;margin:0;padding:20px;}
  .wrap{max-width:760px;margin:0 auto;}
  h1{font-size:19px;margin:0 0 4px;}
  .sub{font-size:12px;color:#6E6E73;margin-bottom:16px;}
  #summary{font-size:15px;font-weight:700;padding:12px 14px;border-radius:10px;margin-bottom:14px;}
  .allgood{background:#E3F5E9;color:#1D6F42;border:1px solid #1D6F42;}
  .bad{background:#FDE8E8;color:#CC0000;border:1px solid #CC0000;}
  .group{font-size:11px;font-weight:700;color:#6E6E73;text-transform:uppercase;
         letter-spacing:.5px;margin:18px 0 6px;}
  .t{background:#fff;border:0.5px solid #D1D1D6;border-radius:8px;padding:9px 11px;
     margin-bottom:5px;font-size:13px;display:flex;gap:9px;align-items:flex-start;}
  .t.fail{background:#FFF5F5;border-color:#CC0000;}
  .mark{font-weight:700;flex-shrink:0;}
  .pass .mark{color:#1D6F42;}
  .fail .mark{color:#CC0000;}
  .why{font-size:11px;color:#CC0000;margin-top:4px;font-family:ui-monospace,Menlo,monospace;}
</style>
</head>
<body>
<div class="wrap">
  <h1>GraceKids — tests</h1>
  <div class="sub">Reads the real functions out of index.html and runs them against known inputs.
    Uses invented children only. Green means the app's logic is behaving.</div>
  <div id="summary">Running…</div>
  <div id="out"></div>
</div>

<script type="module">
const results = [];
let currentGroup = '';
function group(name){ currentGroup = name; }
async function check(name, fn){
  try {
    const why = await fn();
    results.push({group:currentGroup, name, pass: why === true || why === undefined, why: why === true ? '' : why});
  } catch (e) {
    results.push({group:currentGroup, name, pass:false, why:'threw: ' + (e && e.message ? e.message : e)});
  }
}

// ---- pull the real functions out of the app -------------------------------
const src = await (await fetch('index.html?cb=' + Date.now())).text();

function grab(name){
  for (const prefix of ['async function ', 'function ']) {
    const start = src.indexOf(prefix + name + '(');
    if (start < 0) continue;
    let i = src.indexOf('{', start), depth = 0;
    for (let j = i; j < src.length; j++) {
      if (src[j] === '{') depth++;
      else if (src[j] === '}') { depth--; if (depth === 0) return src.slice(start, j + 1); }
    }
  }
  throw new Error('function ' + name + ' not found in index.html');
}
const AsyncFn = Object.getPrototypeOf(async function(){}).constructor;

// ===========================================================================
group('Dates and class assignment');

await check('a child moves up a class on their birthday, not the day before', () => {
  const cls = (bday, today) => new Function('B','T',`
    const now=new Date(T); const EV=false;
    ${grab('getAgeMonths')} ${grab('bdayDate')} ${grab('assignClass')}
    return assignClass(B,'');`)(bday, today);
  const b = '2020-09-02';
  const before = cls(b, new Date(2026,8,1,10,0).getTime());
  const on     = cls(b, new Date(2026,8,2,10,0).getTime());
  if (before !== 'Kindergarten') return 'day before 6th birthday gave ' + before + ', expected Kindergarten';
  if (on !== 'GraceKids 1')      return 'on 6th birthday gave ' + on + ', expected GraceKids 1';
  return true;
});

await check('a child under two is in Nursery', () => {
  const cls = new Function(`
    const now=new Date(2026,8,2); const EV=false;
    ${grab('getAgeMonths')} ${grab('bdayDate')} ${grab('assignClass')}
    return assignClass('2025-06-01','');`)();
  return cls === 'Nursery' ? true : 'got ' + cls;
});

await check('the date is worked out locally, so a late evening stays on the same day', () => {
  const f = new Function(`${grab('localDay')} return localDay;`)();
  const summer = f(new Date(2026,7,30,20,5));   // 8:05pm, after UTC rolls over
  const winter = f(new Date(2026,0,11,19,5));   // 7:05pm in winter
  if (summer !== '2026-08-30') return 'summer 20:05 gave ' + summer;
  if (winter !== '2026-01-11') return 'winter 19:05 gave ' + winter;
  return true;
});

// ===========================================================================
group('The evening service is not reset underneath you');

const stale = (nowLocal, checkedInAt) => new Function('NOW','CI',`
  const now=new Date(NOW);
  const timeVal=now.getHours()*60+now.getMinutes();
  const autoSession=(timeVal>=8*60&&timeVal<14*60)?'morning':'evening';
  let children=[{name:'Test, Child', checkedIn:true, ciTime:CI}];
  ${grab('localDay')} ${grab('sessionForTime')} ${grab('staleCheckins')}
  return staleCheckins().length>0;`)(nowLocal.getTime(), checkedInAt.getTime());

await check('a child checked in at 4pm is not flagged at 7:05pm in winter', () =>
  stale(new Date(2026,0,11,19,5), new Date(2026,0,11,16,0)) ? 'flagged - the evening service would be auto-reset' : true);

await check('a child checked in at 4pm is not flagged at 8:05pm in summer', () =>
  stale(new Date(2026,7,30,20,5), new Date(2026,7,30,16,0)) ? 'flagged - the evening service would be auto-reset' : true);

await check("yesterday's check-in is still flagged as stale", () =>
  stale(new Date(2026,7,30,10,0), new Date(2026,7,29,16,0)) ? true : 'not flagged - genuinely stale sessions would never clear');

// ===========================================================================
group('Check-in and check-out');

await check('cancelling a family check-in leaves a sibling who was already in', () => {
  const out = new Function(`
    let previewMode='checkin';
    let children=[{name:'Fam, Ada',checkedIn:true,cl:{OLD:1},placementCls:'Room 3'},
                  {name:'Fam, Ben',checkedIn:true,cl:{NEW:1},placementCls:'Room 5'}];
    let pendingFamily=[children[0],children[1]], pendingFamilyCode='1234';
    let pendingFamilyWasIn=new Set(['Fam, Ada']);
    let pendingCheckinIdx=null;
    const synced=[]; const mkCL=()=>({}); const syncOneChild=(c)=>synced.push(c.name);
    const renderList=()=>{}, renderDashboard=()=>{}, showUndo=()=>{}, closeAllModals=()=>{}, focusSearch=()=>{};
    const document={getElementById:()=>({style:{},value:'',focus(){},querySelector:()=>null})};
    ${grab('cancelCheckin')}
    try{ cancelCheckin(); }catch(e){}
    return {ada:children[0], ben:children[1], synced};`)();
  if (out.ada.checkedIn !== true)  return 'Ada was checked out - she was already in before this family check-in';
  if (out.ada.placementCls !== 'Room 3') return "Ada's room was cleared";
  if (out.ben.checkedIn !== false) return 'Ben was not reverted';
  if (out.synced.join() !== 'Fam, Ben') return 'wrote to Firebase for: ' + out.synced.join(', ');
  return true;
});

await check('a security code stored as a number still matches', () => {
  const match = new Function('KIDS','TYPED',`
    const children=KIDS; ${grab('childrenWithCode')}
    return childrenWithCode(TYPED).map(c=>c.name);`);
  const roster = [
    {name:'AsText, A',   checkedIn:true,  code:'4827'},
    {name:'AsNumber, B', checkedIn:true,  code:4827},
    {name:'Padded, C',   checkedIn:true,  code:' 4827 '},
    {name:'NotIn, D',    checkedIn:false, code:'4827'},
    {name:'Other, E',    checkedIn:true,  code:'1111'}
  ];
  const got = match(roster, '4827').sort().join(', ');
  const want = 'AsNumber, B, AsText, A, Padded, C';
  return got === want ? true : 'got ' + got;
});

await check('a code lookup ignores children who are not checked in, and other families', () => {
  const match = new Function('KIDS',`
    const children=KIDS; ${grab('childrenWithCode')}
    return childrenWithCode('4827').map(c=>c.name);`);
  const got = match([
    {name:'In, A',    checkedIn:true,  code:'4827'},
    {name:'NotIn, B', checkedIn:false, code:'4827'},
    {name:'Other, C', checkedIn:true,  code:'9999'}
  ]);
  return got.join() === 'In, A' ? true : 'got ' + got.join(', ');
});


// ===========================================================================
group('What gets written down');

await check('a check-out records the time and the code that was presented', async () => {
  const box = document.createElement('div'); box.id = 'tbox'; document.body.appendChild(box);
  const run = await new AsyncFn('BOX',`
    let pendingCheckoutCode='4827', pendingCheckoutNames=null;
    let children=[{name:'Fam, Ada',checkedIn:true,code:'4827'},
                  {name:'Fam, Ben',checkedIn:true,code:'4827'}];
    const mkCL=()=>({}), fullName=n=>n;
    ${grab('escHtml')}
    const closeAllModals=()=>{}, focusSearch=()=>{}, renderList=()=>{}, renderDashboard=()=>{};
    const syncOneChild=async()=>{}; const alert=()=>{};
    ${grab('checkoutRowHTML')} ${grab('confirmFamilyCheckout')}
    pendingCheckoutNames=children.map(c=>c.name);
    BOX.innerHTML=children.map((c,i)=>checkoutRowHTML(c,i,'co-fam',false)).join('');
    BOX.querySelector('#co-fam-1').checked=false;      // Ben stays in
    await confirmFamilyCheckout();
    return children.map(c=>({n:c.name,out:!c.checkedIn,time:!!c.coTime,code:c.coCode||null}));`)(box);
  box.remove();
  const ada = run[0], ben = run[1];
  if (!ada.out)            return 'Ada was not checked out';
  if (!ada.time)           return 'no check-out time recorded for Ada';
  if (ada.code !== '4827') return 'code recorded as ' + ada.code + ', expected 4827';
  if (ben.out)             return 'Ben was checked out despite being unticked';
  if (ben.time)            return 'Ben got a check-out time despite staying in';
  return true;
});

await check('a medical note containing "<" is not swallowed', () => {
  const esc = new Function(`${grab('escHtml')} return escHtml;`)();
  const note = 'Give <half a tablet with food';
  const d = document.createElement('div');
  d.innerHTML = '<div>' + esc(note) + '</div>';
  return d.textContent === note ? true : 'displayed as: "' + d.textContent + '"';
});

await check('a phone number is cleaned up before it is sent', () => {
  const n = new Function(`${grab('normPhone')} return normPhone;`)();
  const forms = ['2892187488','(289) 218-7488','289-218-7488','+1 289 218 7488','289 218 7488'];
  const bad = forms.filter(f => n(f) !== '2892187488');
  return bad.length ? 'these did not normalise: ' + bad.join(' | ') : true;
});

// ===========================================================================
group('What the desk is told about a text');

await check("Twilio's real status is recorded, and queued is not called delivered", () => {
  window.__w = [];
  const run = (twStatus, err) => new Function('ST','ERR',`
    let textCtxChild='Test, Child';
    const auth={currentUser:{email:'desk@example.com'}};
    const db={}; const ref=(d,p)=>p;
    const set=(p,rec)=>{ __w.push(rec); return Promise.resolve(); };
    ${grab('normPhone')}
    ${grab('logTextSends')}
    const data = ST===null ? null : {results:[{phone:'2892187488', status:ST, error:ERR||undefined}]};
    logTextSends(['2892187488'],'hello',data,{});
    return __w[__w.length-1];
  `)(twStatus, err);

  const queued    = run('queued');
  const delivered = run('delivered');
  const undel     = run('undelivered');
  const errored   = run('error','invalid recipient');
  const noAnswer  = run(null);

  if (queued.status !== 'accepted')      return 'queued was recorded as "' + queued.status + '" - it must not count as delivered';
  if (queued.twilio !== 'queued')        return "Twilio's own word was not kept, got " + queued.twilio;
  if (delivered.status !== 'delivered')  return 'delivered was recorded as ' + delivered.status;
  if (undel.status !== 'failed')         return 'undelivered was recorded as ' + undel.status;
  if (errored.status !== 'failed')       return 'an error was recorded as ' + errored.status;
  if (noAnswer.status !== 'unconfirmed') return 'no response was recorded as ' + noAnswer.status;
  return true;
});

// ===========================================================================
group('Did the text actually arrive?');

await check('delivery status is looked up, and only for messages still unresolved', async () => {
  const T = Date.now();
  const AsyncFn = Object.getPrototypeOf(async function(){}).constructor;
  const store = {
    q1:{ts:T-600000, sid:'SMaaa', status:'accepted', twilio:'queued'},
    q2:{ts:T-900000, sid:'SMbbb', status:'accepted', twilio:'queued'},
    done:{ts:T-800000, sid:'SMccc', status:'delivered', twilio:'delivered'},
    nosid:{ts:T-700000, status:'accepted', twilio:'queued'},
    old:{ts:T-5*86400000, sid:'SMddd', status:'accepted', twilio:'queued'}
  };
  const out = await new AsyncFn('STORE',`
    const asked=[]; const written=[];
    const db={}; const ref=(d,p)=>p;
    const get=async()=>({val:()=>STORE});
    const update=async(p,u)=>{ written.push(u); };
    const fetch=async(url,opts)=>{
      asked.push(JSON.parse(opts.body).check);
      return {status:200, text:async()=>JSON.stringify({success:true, checked:[
        {sid:'SMaaa', status:'delivered', error:''},
        {sid:'SMbbb', status:'undelivered', error:'Unreachable destination handset'}
      ]})};
    };
    var msgChecking=false; var msgCheckNote=''; var MSG_ENDPOINT='x';
    ${grab('refreshDeliveryStatus')}
    const n = await refreshDeliveryStatus();
    return {n, asked, written};
  `)(store);

  const asked = out.asked[0] || [];
  if (asked.includes('SMccc')) return 'asked about a message already known to be delivered';
  if (asked.includes('SMddd')) return 'asked about a message older than the lookup window';
  if (asked.length !== 2)      return 'asked about ' + asked.length + ' messages, expected 2';
  const w = out.written[0] || {};
  if (w['q1/status'] !== 'delivered') return 'a delivered message was recorded as ' + w['q1/status'];
  if (w['q2/status'] !== 'failed')    return 'an undelivered message was recorded as ' + w['q2/status'];
  if (!w['q2/error'])                 return "the carrier's reason was not kept";
  return true;
});

// ===========================================================================
group('One-time guests');

await check('a one-time guest is active all day, including the evening service, then archived', () => {
  const inact = (c) => new Function('C',`
    const now=new Date(2026,8,2,10,0);
    let checkInHistory=[];
    ${grab('localDay')} ${grab('buildInactiveMap')} ${grab('isInactive')}
    return isInactive(C, buildInactiveMap());`)(c);
  const today = new Date(2026,8,2,9,30).getTime();
  const lastWeek = new Date(2026,7,26,9,30).getTime();
  const morning   = {name:'Guest, G', oneTimeGuest:true, registeredAt:today};
  const afterAM   = {name:'Guest, G', oneTimeGuest:true, registeredAt:today, coTime:new Date(2026,8,2,12,45).getTime()};
  const nextTime  = {name:'Guest, G', oneTimeGuest:true, registeredAt:lastWeek, coTime:lastWeek};
  const ordinary  = {name:'Normal, N', registeredAt:lastWeek, coTime:lastWeek};
  if (inact(morning))  return 'archived before they were even checked out';
  if (inact(afterAM))  return 'archived after the morning service - they could not come back in the evening';
  if (!inact(nextTime))return 'still active on a later Sunday - should be archived';
  if (inact(ordinary)) return 'an ordinary child was archived';
  return true;
});

// ===========================================================================
group('Who may bump a member at capacity');

await check('only a child registered today, who is not a member, may bump', () => {
  const NOW = new Date(2026,8,2,10,0), DAY = 86400000;
  const can = (c) => new Function('C','N',`
    const now=new Date(N); ${grab('localDay')} ${grab('canBump')} return canBump(C);`)(c, NOW.getTime());
  const cases = [
    ['member registered today',      {member:true,  registeredAt:NOW.getTime()},        false],
    ['visitor already in registry',  {member:false, registeredAt:NOW.getTime()-7*DAY},  false],
    ['existing record, no stamp',    {member:false},                                    false],
    ['registered today at the desk', {member:false, registeredAt:NOW.getTime()},        true ]
  ];
  const wrong = cases.filter(([,c,want]) => can(c) !== want).map(([l]) => l);
  return wrong.length ? 'wrong for: ' + wrong.join('; ') : true;
});

// ===========================================================================
group('Bulk check-out is limited to Jr Youth');

await check('only Jr Youth offers a check-out-all button', () => {
  const can = (cls) => new Function('CLS', `
    ${grab('canBulkCheckout')} return canBulkCheckout(CLS);`)(cls);
  const morning = ['Nursery','Preschool','Kindergarten','GraceKids 1',
                   'GraceKids 2A','GraceKids 2B','Jr Youth'];
  const other   = ['One-to-One', '', null, undefined, 'jr youth', 'Jr  Youth'];
  const wrong = [];
  morning.forEach(c => { if (can(c) !== (c === 'Jr Youth')) wrong.push(c); });
  other.forEach(c => { if (can(c)) wrong.push(String(c)); });
  return wrong.length ? 'wrong for: ' + wrong.join('; ') : true;
});

// ===========================================================================
group('Teacher counts belong to one service');

await check('changing service, or opening on a new day, clears the counts', () => {
  const mark = (dayMs, sess) => new Function('D','S', `
    const now=new Date(D), session=S; ${grab('localDay')} ${grab('workerCountsMark')}
    return workerCountsMark();`)(dayMs, sess);
  const SUN = new Date(2026,8,6,10,0).getTime();      // Sunday morning
  const SUNPM = new Date(2026,8,6,16,0).getTime();    // same Sunday, evening
  const NEXT = new Date(2026,8,13,10,0).getTime();    // the following Sunday

  const cases = [
    ['same service, same day',   mark(SUN,'morning'),   mark(SUN,'morning'),   true ],
    ['morning then evening',     mark(SUN,'morning'),   mark(SUNPM,'evening'), false],
    ['same service, next week',  mark(SUN,'morning'),   mark(NEXT,'morning'),  false]
  ];
  const wrong = cases.filter(([,a,b,same]) => (a===b) !== same).map(([l]) => l);
  if (wrong.length) return 'wrong for: ' + wrong.join('; ');

  // and the counts themselves actually go to zero
  const t = {Nursery:3, Preschool:2}, sw = {Nursery:1};
  new Function('T','S', `${grab('resetWorkerCounts')} resetWorkerCounts(T,S);`)(t, sw);
  const left = [...Object.values(t), ...Object.values(sw)].filter(v => v !== 0);
  return left.length ? 'a count survived the reset' : true;
});

// ===========================================================================
group('Sending: a failure is never called a success');

await check('an incident is only cleared when the email service confirmed it', () => {
  const verdict = (sum) => new Function('S', `${grab('sendVerdict')} return sendVerdict(S);`)(sum);
  const cases = [
    ['service unreachable / no reply', null,                              'unconfirmed'],
    ['all recipients accepted',        {ok:['a@x.com','b@x.com'], bad:[]}, 'sent'],
    ['one recipient failed',           {ok:['a@x.com'], bad:['b@x.com']},  'partial']
  ];
  const wrong = cases.filter(([,s,want]) => verdict(s) !== want).map(([l]) => l);
  return wrong.length ? 'wrong for: ' + wrong.join('; ') : true;
});

// ===========================================================================
group('Desks agree with each other');

await check('clearing the teacher counts reaches a desk that did not do the clearing', () => {
  const apply = (local, snap) => new Function('L','T', `
    const isEditingCounter = () => false; ${grab('applyCounterSnapshot')}
    applyCounterSnapshot(L, T, 'teacher-input'); return L;`)(local, snap);
  const a = apply({Nursery:3, Preschool:2}, {});             // node emptied
  const b = apply({Nursery:3, Preschool:2}, {Nursery:1});    // one class re-entered
  if (a.Nursery !== 0 || a.Preschool !== 0) return 'an emptied node left ' + JSON.stringify(a);
  if (b.Nursery !== 1 || b.Preschool !== 0) return 'a partial node left ' + JSON.stringify(b);
  return true;
});

await check('an old unsent change is not replayed over a newer one', () => {
  const stale = (cur, ts) => new Function('C','T', `${grab('replayIsStale')} return replayIsStale(C,T);`)(cur, ts);
  const T = 1_000_000;
  const cases = [
    ['database has something newer',   {updatedAt: T + 5000}, T, true ],
    ['database has something older',   {updatedAt: T - 5000}, T, false],
    ['record has no stamp yet',        {name:'x'},            T, false],
    ['nothing there at all',           null,                  T, false]
  ];
  const wrong = cases.filter(([,c,t,want]) => stale(c,t) !== want).map(([l]) => l);
  return wrong.length ? 'wrong for: ' + wrong.join('; ') : true;
});

// ===========================================================================
group('The pickup slip');

await check('the family letters on the slip come from the name, on reprint too', () => {
  const label = (n, c) => new Function('N','C', `${grab('familySlipLabel')} return familySlipLabel(N,C);`)(n, c);
  if (label('Brannagh, Ellis', 2) !== 'BRA-2') return 'got ' + label('Brannagh, Ellis', 2);
  if (label('Li, Ann', 1) !== 'LI-1') return 'short surname: ' + label('Li, Ann', 1);
  if (label(undefined, 3) !== '-3') return 'missing name should degrade, got ' + label(undefined, 3);
  return true;
});

// ===========================================================================
group('A family cannot slip past the ratio together');

await check('siblings are counted together, not one at a time', () => {
  const RAT = {Nursery:3, Preschool:4};
  const over = (arrivals, roster, teachers) => new Function('A','R','T','RAT', `
    ${grab('capacityCheck')} return capacityCheck(A,R,T,RAT);`)(arrivals, roster, teachers, RAT);

  const kid = (name, cls, checkedIn) => ({name, cls, checkedIn: !!checkedIn, sn:false});
  // one teacher in Nursery = room for 3. Two already in, so one space left.
  const roster = [kid('X, A','Nursery',true), kid('X, B','Nursery',true)];
  const one    = [kid('Y, One','Nursery')];
  const two    = [kid('Y, One','Nursery'), kid('Y, Two','Nursery')];
  const T = {Nursery:1};

  if (over(one, roster.concat(one), T).length) return 'one child fitting was blocked';
  const r = over(two, roster.concat(two), T);
  if (r.length !== 1) return 'two siblings into one space were not caught';
  if (r[0].room !== 1 || r[0].over !== 1) return 'wrong arithmetic: ' + JSON.stringify(r[0]);
  return true;
});

await check('the check only bites where it should', () => {
  const RAT = {Nursery:3, Preschool:4};
  const over = (arrivals, roster, teachers) => new Function('A','R','T','RAT', `
    ${grab('capacityCheck')} return capacityCheck(A,R,T,RAT);`)(arrivals, roster, teachers, RAT);
  const kid = (name, cls, extra) => Object.assign({name, cls, checkedIn:false, sn:false}, extra||{});

  const full = [kid('a,1','Nursery'), kid('a,2','Nursery'), kid('a,3','Nursery'), kid('a,4','Nursery')];
  const cases = [
    ['no teacher set means no cap enforced', full, [], {Nursery:0}, 0],
    ['a class with no ratio is ignored',     [kid('b,1','Jr Youth')], [], {'Jr Youth':1}, 0],
    ['one-to-one children are not counted',  [kid('c,1','Nursery',{sn:true})], [], {Nursery:1}, 0],
    ['siblings split across classes',        [kid('d,1','Nursery'), kid('d,2','Preschool')], [], {Nursery:1,Preschool:1}, 0],
    ['four into a three-child room',         full, full, {Nursery:1}, 1]
  ];
  const wrong = cases.filter(([,a,r,t,want]) => over(a,r,t).length !== want).map(([l]) => l);
  return wrong.length ? 'wrong for: ' + wrong.join('; ') : true;
});

// ===========================================================================
group('The care-list boxes reach the tag');

await check('Ill in last 48hrs is printed, like the other flags', () => {
  const src2 = src;
  const tag = src2.slice(src2.indexOf('function buildPrintHTMLv2('));
  const body = tag.slice(0, tag.indexOf('const digits='));
  const missing = [];
  [['ill','ILL IN LAST 48HRS'], ['noSnack','No Snack'], ['noChange','Do NOT Change'],
   ['noSit','Does Not Sit'], ['potty','Potty Training']].forEach(([f,label]) => {
    if (!body.includes('cl.' + f)) missing.push(f + ' is never read');
    else if (!body.includes(label)) missing.push(f + ' has no label on the tag');
  });
  if (!body.includes('hasX=cl.ill')) missing.push('ill does not open the flags block');
  return missing.length ? missing.join('; ') : true;
});

await check('a box ticked on a reprint is recorded against that child', () => {
  const run = new Function(`
    let pendingFamily = null, pendingReprintCL = {};
    ${grab('famSetCheck')}
    famSetCheck(0,'ill',true); famSetCheck(1,'noSnack',true); famSetCheck(0,'cup',true);
    const duringReprint = JSON.stringify(pendingReprintCL);
    // and during a normal check-in it still writes straight to the family
    pendingFamily = [{cl:{ill:false}}]; pendingReprintCL = {};
    famSetCheck(0,'ill',true);
    return {duringReprint, checkin: pendingFamily[0].cl.ill, untouched: JSON.stringify(pendingReprintCL)};
  `)();
  if (run.duringReprint !== '{"0":{"ill":true,"cup":true},"1":{"noSnack":true}}')
    return 'reprint edits recorded wrongly: ' + run.duringReprint;
  if (run.checkin !== true) return 'check-in path stopped working';
  if (run.untouched !== '{}') return 'check-in wrote into the reprint store too';
  return true;
});

// ===========================================================================
group('A child marked ill is not checked in');

await check('only children arriving with Ill ticked are stopped', () => {
  const ill = (arrivals) => new Function('A', `${grab('illArrivals')} return illArrivals(A);`)(arrivals);
  const kid = (name, isIll) => ({name, cl:{ill:!!isIll, noSnack:false}});
  const cases = [
    ['nobody ill',            [kid('A, One'), kid('B, Two')],                 []],
    ['one sibling ill',       [kid('A, One', true), kid('B, Two')],           ['A, One']],
    ['both ill',              [kid('A, One', true), kid('B, Two', true)],     ['A, One','B, Two']],
    ['no care list at all',   [{name:'C, Three'}],                            []],
    ['nobody arriving',       [],                                             []]
  ];
  const wrong = cases.filter(([,a,want]) => JSON.stringify(ill(a)) !== JSON.stringify(want)).map(([l]) => l);
  return wrong.length ? 'wrong for: ' + wrong.join('; ') : true;
});

await check('the message names the child and says how to undo it', () => {
  const msg = (names) => new Function('N', `
    function fullName(n){var p=String(n).split(", ");return (p[1]||"")+" "+(p[0]||"");}
    ${grab('illMessage')} return illMessage(N);`)(names);
  const one = msg(['Brannagh, Ellis']);
  const two = msg(['Brannagh, Ellis','Brannagh, Elliot']);
  if (!one.includes('Ellis Brannagh is marked ill')) return 'one child reads wrong: ' + one;
  if (!two.includes('Ellis Brannagh and Elliot Brannagh are marked ill')) return 'two children read wrong: ' + two;
  if (!one.includes('untick')) return 'does not say how to undo it';
  return true;
});

// ===========================================================================
// render
const out = document.getElementById('out');
let lastGroup = null, failed = 0;
for (const r of results) {
  if (r.group !== lastGroup) {
    lastGroup = r.group;
    const g = document.createElement('div');
    g.className = 'group'; g.textContent = r.group;
    out.appendChild(g);
  }
  if (!r.pass) failed++;
  const d = document.createElement('div');
  d.className = 't ' + (r.pass ? 'pass' : 'fail');
  const m = document.createElement('span');
  m.className = 'mark'; m.textContent = r.pass ? '✓' : '✗';
  const body = document.createElement('div');
  body.textContent = r.name;
  if (!r.pass && r.why) {
    const w = document.createElement('div');
    w.className = 'why'; w.textContent = r.why;
    body.appendChild(w);
  }
  d.appendChild(m); d.appendChild(body);
  out.appendChild(d);
}
const sum = document.getElementById('summary');
sum.className = failed ? 'bad' : 'allgood';
sum.textContent = failed
  ? failed + ' of ' + results.length + ' checks FAILED — see below'
  : 'All ' + results.length + ' checks passed';
</script>
